<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard operativo{% endblock %}</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; }
    body { margin: 0; padding: 0 1rem 2rem; max-width: 960px; }
    nav { display: flex; flex-wrap: wrap; gap: 0.75rem; padding: 1rem 0; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
    nav a { color: #0b57d0; text-decoration: none; }
    nav a.active { font-weight: 600; text-decoration: underline; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; }
    th { background: #f5f5f5; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.85rem; }
    .badge-pending { background: #fff3cd; }
    .badge-confirmed { background: #d1e7dd; }
    .muted { color: #666; font-size: 0.9rem; }
    pre { background: #f8f8f8; padding: 1rem; overflow-x: auto; font-size: 0.85rem; }
    h1 { font-size: 1.4rem; margin-top: 0; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'operations:orders' %}"{% if request.path == '/' or '/pedidos' in request.path %} class="active"{% endif %}>Pedidos</a>
    <a href="{% url 'operations:reservations' %}"{% if '/reservas' in request.path %} class="active"{% endif %}>Reservas</a>
    <a href="{% url 'operations:menu' %}"{% if '/menu' in request.path %} class="active"{% endif %}>Menú</a>
    <a href="{% url 'operations:users' %}"{% if '/usuarios' in request.path %} class="active"{% endif %}>Usuarios</a>
    <a href="{% url 'operations:system_status' %}"{% if '/estado' in request.path %} class="active"{% endif %}>Estado</a>
    <a href="/admin/">Admin Django</a>
    {% if user.is_authenticated %}
      <span class="muted" style="margin-left:auto;">{{ user.username }}</span>
      <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;margin:0;">
        {% csrf_token %}
        <button type="submit" style="background:none;border:none;color:#0b57d0;cursor:pointer;padding:0;font:inherit;">Salir</button>
      </form>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
