<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Dashboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; }
    body { max-width: 360px; margin: 4rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { margin-top: 1.25rem; padding: 0.5rem 1rem; cursor: pointer; }
    .error { color: #b00020; font-size: 0.9rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Dashboard operativo</h1>
  <p class="muted" style="color:#666;font-size:0.9rem;">Acceso staff (PostgreSQL). Datos de pedidos y menú siguen en Google Sheets / caché local.</p>
  {% if form.errors %}
    <p class="error">Usuario o contraseña incorrectos.</p>
  {% endif %}
  <form method="post" action="{% url 'accounts:login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="id_username">Usuario</label>
    <input type="text" name="username" id="id_username" autofocus required>
    <label for="id_password">Contraseña</label>
    <input type="password" name="password" id="id_password" required>
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
